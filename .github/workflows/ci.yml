# CI for NV-Generate-CTMR: lint and format checks via pre-commit
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-

      - name: Run pre-commit
        run: pre-commit run --all-files

  # Test job (ADR-0015 §6, rev. 2026-08-27): single full-dependency tier — CPU
  # torch + monai installed so torch-level tests run for real on plain CPU
  # instead of skipping. "Missing torch -> install it" replaces the retired
  # ADR-0013 §4 light/skip design; GPU/cluster chains stay out of CI (sugon
  # integration gate, pytest.mark.gpu).
  test-torch:
    name: test (torch stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies (CPU torch + monai + non-GPU stack)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest numpy nibabel scikit-image Pillow SimpleITK monai tqdm scipy matplotlib huggingface_hub nnunetv2 connected-components-3d

      - name: Install the ctmr package (editable; the single import track now that the pytest pythonpath key is retired, issue #143)
        run: pip install -e . --no-deps

      - name: Run tests
        run: pytest
