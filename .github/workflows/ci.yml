# CI for NV-Generate-CTMR: lint and format checks via pre-commit
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-

      - name: Run pre-commit
        run: pre-commit run --all-files

  # Single full-dependency test job (ADR-0015 §6 revision, 2026-08-27): CPU torch +
  # monai + all non-GPU deps in one job. torch-level tests MUST really execute —
  # importorskip fallbacks and the light/heavy-stack split are void. GPU-level
  # chains live on the sugon integration gate, not here.
  test:
    name: test (full dependency stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies (CPU torch + monai + non-GPU stack)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest numpy nibabel scikit-image Pillow SimpleITK monai tqdm scipy matplotlib huggingface_hub

      - name: Run tests
        run: pytest
