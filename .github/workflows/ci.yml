# CI for NV-Generate-CTMR: lint and format checks via pre-commit
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-

      - name: Run pre-commit
        run: pre-commit run --all-files

  # Light sci-stack test job (ADR-0013 §4): explicit pip list, NOT requirements.txt
  # (which pulls the full torch stack). torch-level tests skip themselves via
  # pytest.importorskip; GPU/cluster chains stay out of CI (sugon integration gate).
  test:
    name: test (light sci stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest numpy nibabel scikit-image Pillow SimpleITK

      - name: Run tests
        run: pytest
