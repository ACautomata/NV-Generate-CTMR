# NV-Generate-CTMR package + tooling config (pre-commit, ruff, pytest).
# Installable since issue #130 (ADR-0015 §3): runtime dependencies stay EMPTY --
# version locking remains requirements.txt's job until the M5 pivot
# (pip -e + explicit light-sci-stack lists).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctmr"
version = "0.1.0"
description = "NV-Generate-CTMR BraTS2023 rectified-flow finetuning -- the ctmr package and unified CLI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ctmr = "ctmr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# pytest-only config (ADR-0013 §6): src on sys.path without conftest hacks or an
# installable package; "." keeps the repo root importable (scripts.* wrappers).
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "torch: torch-level test; auto-skipped via pytest.importorskip when torch is absent",
]

[tool.ruff]
target-version = "py311"
line-length = 150
exclude = [".git", "__pycache__", "data", "figures", "assets", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N812", "N813"]  # E501: line length handled by formatter; N812: `functional as F` is standard PyTorch convention; N813: `SimpleITK as sitk` is the documented SimpleITK convention

[tool.ruff.lint.per-file-ignores]
"scripts/compute_fid_2-5d_ct.py" = ["N999"]  # hyphenated filename cannot be renamed
"scripts/nnunet_trainer_250_epochs.py" = ["N801"]  # nnUNet trainer class naming convention
"src/ctmr/instrument/safeglobals.py" = ["N801"]  # ADR-0009-pinned interface name; class-shaped context manager like torch.serialization.safe_globals

[tool.ruff.format]
quote-style = "double"
