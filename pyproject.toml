# Packaging + tooling config (pre-commit, ruff, pytest). NV-Generate-CTMR is an
# installable package as of issue #130 (ADR-0015 §3): runtime deps stay empty,
# requirements.txt owns the version locks. The legacy pytest pythonpath track
# stays until the migration batches close it out (double-track period).

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ctmr"
version = "0.0.0"
description = "Unified CLI for the BraTS2023 MAISI latent-diffusion generation study"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ctmr = "ctmr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# pytest-only config (ADR-0013 §6): src on sys.path without conftest hacks or an
# installable package; "." keeps the repo root importable (scripts.* wrappers).
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "torch: torch-level test; CPU-runnable real execution in the CI full-dependency tier (ADR-0015 §6)",
    "gpu: needs a CUDA device; opt-in via CTMR_RUN_GPU_TESTS=1 on the server tier, auto-skipped locally and in CI (ADR-0015 §6)",
]

[tool.ruff]
target-version = "py311"
line-length = 150
exclude = [".git", "__pycache__", "data", "figures", "assets", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N812", "N813"]  # E501: line length handled by formatter; N812: `functional as F` is standard PyTorch convention; N813: `SimpleITK as sitk` is the documented SimpleITK convention

[tool.ruff.lint.per-file-ignores]
"scripts/compute_fid_2-5d_ct.py" = ["N999"]  # hyphenated filename cannot be renamed
"scripts/nnunet_trainer_250_epochs.py" = ["N801"]  # nnUNet trainer class naming convention
"src/ctmr/instrument/safeglobals.py" = ["N801"]  # ADR-0009-pinned interface name; class-shaped context manager like torch.serialization.safe_globals

[tool.ruff.format]
quote-style = "double"
